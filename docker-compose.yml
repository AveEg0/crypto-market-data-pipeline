services:
  ingester:
    build: .
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    command: ["python", "-m", "crypto_pipeline.ingester", "--symbol", "BTCUSDT", "ETHUSDT"]

  writer:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@crypto-db:5432/${POSTGRES_DB}
      KAFKA_BOOTSTRAP: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
      crypto-db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "crypto_pipeline.writer"]

  migrate:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@crypto-db:5432/${POSTGRES_DB}
    depends_on:
      crypto-db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  crypto-db:
    image: timescale/timescaledb:latest-pg16
    container_name: crypto-db
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - external://0.0.0.0:19092,internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - external://127.0.0.1:19092,internal://redpanda:9092
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda-console:
    image: redpandadata/console:latest
    container_name: redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  timescale_data:
  redpanda_data: