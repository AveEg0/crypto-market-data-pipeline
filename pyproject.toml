[project]
name = "crypto-pipeline"
version = "0.1.0"
authors = [
    { name = "Oleksandr Karmazyn", email = "karmazino548@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.14.0",
    "alembic>=1.18.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "plotly>=7.1.0",
    "psycopg[binary,pool]>=3.3.4",
    "pytest-asyncio>=1.4.0",
    "streamlit>=1.66.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
    "websockets>=16.1.1",
]


[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires a running database"]
