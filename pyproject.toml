[project]
name = "crypto-pipeline"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Oleksandr Karmazyn", email = "karmazino548@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "structlog>=26.1.0",
]


[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
